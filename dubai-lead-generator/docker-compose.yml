version: "3.8"

services:
  # ─────────────────────────────────────────────────────────────
  # PostgreSQL 16 Database
  # ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: litsa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-litsa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-LitsaSecretPass2026!}
      POSTGRES_DB: ${POSTGRES_DB:-litsa_leads}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-litsa_user} -d ${POSTGRES_DB:-litsa_leads}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - litsa_network

  # ─────────────────────────────────────────────────────────────
  # Redis 7 Cache & Task Broker
  # ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: litsa_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - litsa_network

  # ─────────────────────────────────────────────────────────────
  # FastAPI Web Application
  # ─────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: litsa_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-litsa_user}:${POSTGRES_PASSWORD:-LitsaSecretPass2026!}@db:5432/${POSTGRES_DB:-litsa_leads}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    ports:
      - "8000:8000"
    networks:
      - litsa_network

  # ─────────────────────────────────────────────────────────────
  # Celery Asynchronous Background Worker
  # ─────────────────────────────────────────────────────────────
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: litsa_celery
    restart: unless-stopped
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info --concurrency=2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-litsa_user}:${POSTGRES_PASSWORD:-LitsaSecretPass2026!}@db:5432/${POSTGRES_DB:-litsa_leads}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    networks:
      - litsa_network

volumes:
  pgdata:
  redisdata:

networks:
  litsa_network:
    driver: bridge
